name: EmmeEffe RustDesk Build

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:

  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows:
    needs: generate-bridge
    runs-on: windows-2022

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download generated Flutter-Rust bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Force incoming-only mode
        shell: pwsh
        run: |
          $path = "libs/hbb_common/src/config.rs"
          $content = Get-Content $path -Raw

          $pattern = 'pub fn is_incoming_only\(\) -> bool \{.*?\n\}'
          $replacement = @'
          pub fn is_incoming_only() -> bool {
              true
          }
          '@

          $newContent = [regex]::Replace(
              $content,
              $pattern,
              $replacement,
              [System.Text.RegularExpressions.RegexOptions]::Singleline
          )

          Set-Content -Path $path -Value $newContent -Encoding UTF8

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install RustDesk custom Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release

          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)

          Copy-Item `
            "windows-x64-release\*" `
            "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release\" `
            -Recurse -Force

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            "$(dirname "$(dirname "$(which flutter)")")/"

          cd "$(dirname "$(dirname "$(which flutter)")")"

          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install RustDesk dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk
        shell: pwsh
        run: |
          python build.py --portable --flutter --skip-portable-pack --hwcodec --vram

      - name: Prepare Emme Effe EXE
        shell: pwsh
        run: |
          $src = "flutter/build/windows/x64/runner/Release/rustdesk.exe"
          $dst = "artifact"

          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          Copy-Item `
            $src `
            "$dst\rustdesk-host=pbxemmeeffe.dyndns.org,key=4WTIAYQnc4BddzGns6tfwJimRXsKlsKmOjjWHegNtns=.exe"

      - name: Upload Emme Effe client
        uses: actions/upload-artifact@v4
        with:
          name: EmmeEffe-RustDesk-Incoming-Only
          path: artifact/*.exe
