name: EmmeEffe RustDesk Build

# Teleassistenza Emme Effe: Windows 10/11 (Flutter) e Windows 7 (Sciter, x64).
# Tutte le personalizzazioni sono nel sorgente del ramo, tranne quelle al submodulo
# libs/hbb_common (codice RustDesk), applicate qui da res/emmeeffe/patch_hbb_common.ps1.
# Risultato: artifact "EmmeEffe-Assistenza-<versione>" con
#   EmmeEffe-Assistenza.exe (Win10/11) e EmmeEffe-Assistenza-Win7.exe (Win7) + SHA256SUMS.txt

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Nome dell'exe dentro il pacchetto: decide la cartella di estrazione
  # (%LOCALAPPDATA%\assistenza-emme-effe), uguale alle 1.5.x.
  INNER_EXE: "Assistenza-Emme-Effe.exe"

jobs:

  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows:
    needs: generate-bridge
    runs-on: windows-2022

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download generated Flutter-Rust bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Patch hbb_common (solo in ingresso, server e chiave Emme Effe)
        shell: pwsh
        run: ./res/emmeeffe/patch_hbb_common.ps1

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install RustDesk custom Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release

          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)

          Copy-Item `
            "windows-x64-release\*" `
            "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release\" `
            -Recurse -Force

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            "$(dirname "$(dirname "$(which flutter)")")/"

          cd "$(dirname "$(dirname "$(which flutter)")")"

          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install RustDesk dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk
        shell: pwsh
        run: |
          python build.py --portable --flutter --skip-portable-pack --hwcodec --vram

      - name: Prepare RustDesk portable files
        shell: pwsh
        run: |
          if (Test-Path "./rustdesk") {
              Remove-Item "./rustdesk" -Recurse -Force
          }

          Move-Item `
            "flutter/build/windows/x64/runner/Release" `
            "./rustdesk"

          # Come nelle 1.5.x: exe principale con il nome Emme Effe (e copia rustdesk.exe),
          # custom.txt firmato da Emme Effe accanto all'exe.
          Copy-Item "./rustdesk/rustdesk.exe" "./rustdesk/$env:INNER_EXE"
          Copy-Item "./res/emmeeffe/custom.txt" "./rustdesk/custom.txt"
          Get-ChildItem ./rustdesk | Select-Object Name, Length

      - name: Build single portable EXE
        shell: bash
        run: |
          cd libs/portable

          pip3 install -r requirements.txt

          python3 ./generate.py \
            -f ../../rustdesk/ \
            -o . \
            -e "../../rustdesk/$INNER_EXE"

          cd ../..

      - name: Prepare Emme Effe EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "target/release/rustdesk-portable-packer.exe" "artifact/EmmeEffe-Assistenza.exe"

      - name: Upload Win10/11
        uses: actions/upload-artifact@v4
        with:
          name: win10
          path: artifact/*.exe

  build-win7:
    runs-on: windows-2022

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch hbb_common (solo in ingresso, server e chiave Emme Effe)
        shell: pwsh
        run: ./res/emmeeffe/patch_hbb_common.ps1

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 1.75: con le versioni successive la Sciter non funziona (cambio ABI di i128)
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install RustDesk dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk (Sciter)
        shell: bash
        run: |
          python3 res/inline-sciter.py
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          cp ./target/release/rustdesk.exe "./Release/$INNER_EXE"
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x64/sciter.dll
          cp ./res/emmeeffe/custom.txt ./Release/custom.txt
          ls -la ./Release

      - name: Build single portable EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          cd libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e "../../Release/$INNER_EXE"
          cd ../..
          mkdir -p artifact
          cp target/release/rustdesk-portable-packer.exe artifact/EmmeEffe-Assistenza-Win7.exe

      - name: Upload Win7
        uses: actions/upload-artifact@v4
        with:
          name: win7
          path: artifact/*.exe

  bundle:
    needs: [build-windows, build-win7]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Version and checksums
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd out
          sha256sum *.exe | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EmmeEffe-Assistenza-${{ env.VERSION }}
          path: out/*
